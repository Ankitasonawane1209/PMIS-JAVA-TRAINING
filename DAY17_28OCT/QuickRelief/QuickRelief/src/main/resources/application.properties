spring.application.name=QuickRelief
server.port=8081

# Database Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:quickrelief;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Database Initialization
spring.sql.init.mode=always

# MySQL Alternative Configuration (Uncomment to use MySQL)
# spring.datasource.url=jdbc:mysql://localhost:3306/quickrelief?createDatabaseIfNotExist=true&useSSL=false
